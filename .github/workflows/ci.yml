name: CI

# Pushes run these tests through build.yml (which only publishes when they pass), so here: pull
# requests, and calls from build.yml.
on:
  pull_request:
  workflow_call:

env:
  GODOT_VERSION: 4.7.2

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project (builds the .godot/ cache)
        run: godot --headless --import

      - name: Run GUT unit tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit

      - name: Networking smoke test (headless server + clients)
        run: tests/integration/join_smoke.sh

      - name: Lobby smoke test (prefs, ready vote, roles, chat, validator)
        run: tests/integration/lobby_smoke.sh

      - name: Match loop test (bots sabotage, repair, timer, winner)
        run: tests/integration/run_match_loop.sh

      - name: Critical sabotage test (lever pair, reboot, repairs)
        run: tests/integration/critical_lever.sh

      - name: PvP capture chain (broom, grab, cage, free, eliminate, ghost chat)
        run: tests/integration/pvp_capture.sh

      - name: PvP bites (carrier drop, knockdown, swarm bonus, immunity)
        run: tests/integration/pvp_swarm.sh

      - name: PvP items (steal, keycard door, traps, pickups, spare keycard)
        run: tests/integration/pvp_items.sh

      - name: PvP hacked-client requests are all refused
        run: tests/integration/pvp_hack.sh

      - name: Map check (navmesh paths vs the GDD design rules)
        run: tests/integration/map_check.sh

      - name: Plant test (CCTV, ladder, vent shaft, out of bounds)
        run: tests/integration/plant_cctv.sh
