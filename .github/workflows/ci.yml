name: CI

# Pushes run these tests through build.yml (which only publishes when they pass), so here: pull
# requests, and calls from build.yml.
on:
  pull_request:
  workflow_call:

env:
  GODOT_VERSION: 4.7.2

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project (builds the .godot/ cache)
        run: godot --headless --import

      - name: Run GUT unit tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit

      # Every integration test (smoke, lobby, match loop, PvP, map check, plant, M6), in parallel.
      # Each test's output is printed in one block when it finishes; see the file for the list.
      - name: Integration tests (headless server + bot clients)
        run: tests/integration/run_all.sh -j 3
